<script>
(function(){
'use strict';
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

/* ============ 画布 ============ */
const bg=document.getElementById('bg'), sx=bg.getContext('2d');
const sp=document.getElementById('splat'), sc=sp.getContext('2d');
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  [bg,sp,cv].forEach(c=>{c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';});
  [sx,sc,ctx].forEach(c=>{c.setTransform(DPR,0,0,DPR,0,0);});
  drawFloor();
}
function drawFloor(){
  sx.clearRect(0,0,W,H);
  const g=sx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#efe4cf'); g.addColorStop(.5,'#e3d6bd'); g.addColorStop(1,'#d9c9ac');
  sx.fillStyle=g; sx.fillRect(0,0,W,H);
  const T=Math.max(90,Math.min(W,H)/7);
  for(let y=0;y<H+T;y+=T)for(let x=0;x<W+T;x+=T){
    const off=(Math.round(y/T)%2)?T/2:0;
    sx.fillStyle=((Math.round(y/T)+Math.round(x/T))%2)?'#e7dbc4':'#ded0b4';
    sx.fillRect(x+off,y,T,T);
  }
  sx.strokeStyle='rgba(150,132,105,.55)'; sx.lineWidth=2;
  for(let y=0;y<H+T;y+=T){const off=(Math.round(y/T)%2)?T/2:0;
    sx.beginPath();sx.moveTo(0,y);sx.lineTo(W,y);sx.stroke();
    for(let x=off;x<W+T;x+=T){sx.beginPath();sx.moveTo(x,y);sx.lineTo(x,y+T);sx.stroke();}}
  // 脏点与踢脚线
  for(let i=0;i<160;i++){sx.fillStyle='rgba(120,102,80,'+rand(.03,.10)+')';
    sx.beginPath();sx.arc(rand(0,W),rand(0,H),rand(.8,3),0,TAU);sx.fill();}
  sx.fillStyle='rgba(96,78,58,.30)'; sx.fillRect(0,0,W,14);
}

/* ============ 音效 ============ */
let actx=null,muted=false;
function AC(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function noiseBuf(a){ if(!a._nb){const b=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; a._nb=b;} return a._nb; }
function sfxSplat(){
  const a=AC(); if(!a||muted)return; const t=a.currentTime;
  const s=a.createBufferSource(); s.buffer=noiseBuf(a); s.playbackRate.value=rand(.7,1.1);
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(2600,t);
  f.frequency.exponentialRampToValueAtTime(240,t+.22);
  const g=a.createGain(); g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.001,t+.26);
  s.connect(f);f.connect(g);g.connect(a.destination); s.start(t); s.stop(t+.3);
  const o=a.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(52,t+.16);
  const g2=a.createGain(); g2.gain.setValueAtTime(.34,t); g2.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g2);g2.connect(a.destination); o.start(t); o.stop(t+.22);
}
function sfxSwat(){
  const a=AC(); if(!a||muted)return; const t=a.currentTime;
  const s=a.createBufferSource(); s.buffer=noiseBuf(a); s.playbackRate.value=1.6;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2;
  f.frequency.setValueAtTime(1500,t); f.frequency.exponentialRampToValueAtTime(320,t+.13);
  const g=a.createGain(); g.gain.setValueAtTime(.28,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);
  s.connect(f);f.connect(g);g.connect(a.destination); s.start(t); s.stop(t+.17);
}
function sfxCombo(n){
  const a=AC(); if(!a||muted)return; const t=a.currentTime;
  const o=a.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(520+Math.min(n,10)*45,t);
  o.frequency.exponentialRampToValueAtTime(1100+Math.min(n,10)*70,t+.12);
  const g=a.createGain(); g.gain.setValueAtTime(.20,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g);g.connect(a.destination); o.start(t); o.stop(t+.26);
}

// 贴图参数：躯体(不含触角)占图宽比例 / 躯体中心锚点(x,y 比例)
const RSPRITE={bodyFrac:0.5861,axFrac:0.3532,ayFrac:0.5199};
class Roach{
  constructor(){
    const edge=(Math.random()*4)|0;
    if(edge===0){this.x=rand(-60,W+60);this.y=-50;}
    else if(edge===1){this.x=rand(-60,W+60);this.y=H+50;}
    else if(edge===2){this.x=-50;this.y=rand(-60,H+60);}
    else{this.x=W+50;this.y=rand(-60,H+60);}
    this.len=rand(38,52);                 // 体长（不含触角）
    this.w=this.len*0.44;
    this.angle=Math.atan2(H/2-this.y,W/2-this.x)+rand(-.6,.6);
    this.baseSpeed=rand(135,255);
    this.speed=this.baseSpeed;
    this.state='run'; this.timer=rand(.4,1.6);
    this.legPhase=Math.random()*TAU;
    this.antennaPhase=Math.random()*TAU;
    this.skittish=Math.random()<.35;      // 一部分会怕拖鞋、加速逃窜
    this.jitter=rand(1.6,3.4);
    this.dead=false; this.squash=0;
    this.moveAmt=1;
    this.wobble=Math.random()*TAU;
    this.alpha=0;                         // 出场淡入，避免凭空出现
  }
  update(dt,mx,my){
    if(this.dead){ this.squash=Math.min(1,this.squash+dt*7); return; }
    this.alpha=Math.min(1,this.alpha+dt*2.6);
    // 状态机：狂奔 / 急停（原地搓触角）
    this.timer-=dt;
    if(this.timer<=0){
      if(this.state==='run'){ this.state='stop'; this.timer=rand(.25,1.0); }
      else { this.state='run'; this.timer=rand(.8,2.4); this.speed=this.baseSpeed*rand(.85,1.3); }
    }
    // 靠近拖鞋时惊逃
    let spd = this.state==='run'?this.speed:0;
    if(this.skittish){
      const d=Math.hypot(mx-this.x,my-this.y);
      if(d<95){ const away=Math.atan2(this.y-my,this.x-mx);
        this.angle=lerpAng(this.angle,away,0.10*dt*60); spd=this.baseSpeed*1.5; }
    }
    spd*=G.speedMul;                      // 随时间整体提速，最后 5 秒最疯
    // 随机转向 + 边缘回避
    this.angle+=rand(-1,1)*this.jitter*dt;
    const m=110; let axs=0, ays=0;
    if(this.x<m) axs+=1-this.x/m; if(this.x>W-m) axs-=1-(W-this.x)/m;
    if(this.y<m) ays+=1-this.y/m; if(this.y>H-m) ays-=1-(H-this.y)/m;
    if(axs||ays) this.angle=lerpAng(this.angle,Math.atan2(ays,axs),0.13*dt*60);

    const step=spd*dt;
    this.x+=Math.cos(this.angle)*step;
    this.y+=Math.sin(this.angle)*step;
    // 撞到墙/屏幕边就折返，保证场上始终有目标
    const pad=8;
    if(this.x<pad){ this.x=pad; this.angle=Math.PI-this.angle; }
    if(this.x>W-pad){ this.x=W-pad; this.angle=Math.PI-this.angle; }
    if(this.y<pad){ this.y=pad; this.angle=-this.angle; }
    if(this.y>H-pad){ this.y=H-pad; this.angle=-this.angle; }
    this.wobble+=dt*(spd>10?14:6);
    this.legPhase+=dt*(spd>10?Math.min(spd*0.10,20):2.2);
    this.moveAmt=clamp(spd/190,0,1.6);
    this.antennaPhase+=dt*7;
    if(this.x<-140||this.x>W+140||this.y<-140||this.y>H+140) this.esc=true;
  }
  draw(c){
    const L=this.len;
    c.save(); c.translate(this.x,this.y); c.rotate(this.angle);
    if(this.dead){
      const k=this.squash;
      c.scale(1+k*.55,1-k*.72); c.globalAlpha=1-k*.25;
    }
    // 影子
    c.save(); c.globalAlpha=.28; c.fillStyle='#000';
    c.beginPath(); c.ellipse(2,3,L*.50,L*.27,0,0,TAU); c.fill(); c.restore();

    // ---- 写实贴图分支（图片加载成功后优先使用） ----
    if(roachImgReady && ROACH_IMG.naturalWidth>0){
      const run=this.dead?0:clamp(this.moveAmt||1,0,1.6);
      c.rotate(Math.sin(this.legPhase*0.85)*0.055*run);          // 疾跑左右扭动
      c.scale(1,1+Math.sin(this.legPhase*1.7)*0.025*run);        // 奔跑起伏
      const img=ROACH_IMG, nw=img.naturalWidth, nh=img.naturalHeight;
      const s=L/(nw*RSPRITE.bodyFrac);
      c.drawImage(img,-nw*RSPRITE.axFrac*s,-nh*RSPRITE.ayFrac*s,nw*s,nh*s);
      c.restore(); return;
    }

    const ph=this.legPhase;
    // ---- 六足（三脚架步态）----
    c.strokeStyle='#3a2010'; c.lineWidth=Math.max(1.1,L*.032); c.lineCap='round';
    for(let i=0;i<6;i++){
      const side=i<3?-1:1, k=i%3;
      const hx=[L*.16,0,-L*.17][k], hy=side*L*.14;
      const sw=Math.sin(ph+k*Math.PI+(side<0?0:Math.PI))*1;
      const kx=hx+L*.16+sw*L*.05, ky=side*(L*.34);
      const fx=kx+L*.10+sw*L*.16, fy=side*(L*.60+Math.abs(sw)*L*.05);
      c.beginPath(); c.moveTo(hx,hy); c.quadraticCurveTo(hx+L*.06,side*L*.24,kx,ky);
      c.stroke();
      c.beginPath(); c.moveTo(kx,ky); c.quadraticCurveTo(kx+L*.07,side*L*.50,fx,fy); c.stroke();
      // 爪
      c.beginPath(); c.moveTo(fx,fy); c.lineTo(fx+L*.05,fy+side*L*.04); c.stroke();
      // 腿刺
      c.lineWidth=Math.max(.7,L*.018);
      for(let s=1;s<=2;s++){const t=s/3;
        const px=kx+(fx-kx)*t, py=ky+(fy-ky)*t;
        c.beginPath(); c.moveTo(px,py); c.lineTo(px+L*.04,py-side*L*.05); c.stroke();}
      c.lineWidth=Math.max(1.1,L*.032);
    }

    // ---- 腹部 ----
    const abd=c.createLinearGradient(0,-L*.3,0,L*.3);
    abd.addColorStop(0,'#8b4a1e'); abd.addColorStop(.42,'#6e3714');
    abd.addColorStop(1,'#3d1e08');
    c.fillStyle=abd;
    c.beginPath(); c.moveTo(L*.10,-L*.21);
    c.bezierCurveTo(-L*.10,-L*.30,-L*.42,-L*.24,-L*.55,0);
    c.bezierCurveTo(-L*.42,L*.24,-L*.10,L*.30,L*.10,L*.21);
    c.bezierCurveTo(L*.16,L*.10,L*.16,-L*.10,L*.10,-L*.21);
    c.fill();
    // 腹节
    c.strokeStyle='rgba(40,20,6,.55)'; c.lineWidth=Math.max(.8,L*.017);
    for(let i=1;i<=5;i++){const px=-L*.06-i*L*.085;
      c.beginPath(); c.moveTo(px,-L*.20+Math.abs(i-3)*L*.012);
      c.quadraticCurveTo(px-L*.03,0,px,L*.20-Math.abs(i-3)*L*.012); c.stroke();}

    // ---- 翅（左右鞘翅）----
    for(const s of [-1,1]){
      const wg=c.createLinearGradient(0,s*L*.04,0,s*L*.24);
      wg.addColorStop(0,'#a26327'); wg.addColorStop(.55,'#793f16'); wg.addColorStop(1,'#43210a');
      c.fillStyle=wg;
      c.beginPath(); c.moveTo(L*.09,0);
      c.bezierCurveTo(L*.02,s*L*.20,-L*.30,s*L*.24,-L*.50,s*L*.06);
      c.bezierCurveTo(-L*.30,s*L*.16,L*.02,s*L*.12,L*.09,0);
      c.fill();
      // 外缘浅色带（美洲大蠊特征）
      c.strokeStyle='rgba(226,182,110,.55)'; c.lineWidth=Math.max(.8,L*.022);
      c.beginPath(); c.moveTo(L*.04,s*L*.13);
      c.quadraticCurveTo(-L*.22,s*L*.21,-L*.44,s*L*.09); c.stroke();
      // 翅脉
      c.strokeStyle='rgba(30,16,4,.35)'; c.lineWidth=Math.max(.6,L*.013);
      for(let v=1;v<=3;v++){const t=v/4;
        c.beginPath(); c.moveTo(L*.07,s*L*.05);
        c.quadraticCurveTo(-L*.20,s*L*.10*t*2,-L*.46,s*L*.05*t*1.8); c.stroke();}
      // 高光
      c.fillStyle='rgba(255,226,180,.16)';
      c.beginPath(); c.ellipse(-L*.10,s*L*.11,L*.26,L*.045,0,0,TAU); c.fill();
    }
    // 中缝
    c.strokeStyle='rgba(28,14,4,.55)'; c.lineWidth=Math.max(.7,L*.016);
    c.beginPath(); c.moveTo(L*.08,0); c.lineTo(-L*.50,0); c.stroke();

    // ---- 前胸背板（带浅色环）----
    c.save();
    const pr=c.createLinearGradient(L*.28,0,L*.04,0);
    pr.addColorStop(0,'#8f4d1d'); pr.addColorStop(.5,'#c98f42'); pr.addColorStop(1,'#75401a');
    c.fillStyle=pr;
    c.beginPath(); c.moveTo(L*.30,0);
    c.bezierCurveTo(L*.27,-L*.20,L*.08,-L*.24,L*.02,-L*.20);
    c.bezierCurveTo(-L*.02,-L*.08,-L*.02,L*.08,L*.02,L*.20);
    c.bezierCurveTo(L*.08,L*.24,L*.27,L*.20,L*.30,0); c.fill();
    c.strokeStyle='rgba(240,208,142,.85)'; c.lineWidth=Math.max(.8,L*.024);
    c.beginPath(); c.moveTo(L*.30,0);
    c.bezierCurveTo(L*.27,-L*.19,L*.09,-L*.23,L*.03,-L*.19);
    c.bezierCurveTo(-L*.01,-L*.07,-L*.01,L*.07,L*.03,L*.19);
    c.bezierCurveTo(L*.09,L*.23,L*.27,L*.19,L*.30,0); c.stroke();
    // 背板中央暗斑
    c.fillStyle='rgba(58,30,10,.45)';
    c.beginPath(); c.ellipse(L*.13,0,L*.10,L*.09,0,0,TAU); c.fill();
    c.restore();

    // ---- 头 ----
    c.fillStyle='#4a2409';
    c.beginPath(); c.ellipse(L*.36,0,L*.10,L*.115,0,0,TAU); c.fill();
    c.fillStyle='#2c1405';
    c.beginPath(); c.ellipse(L*.40,0,L*.055,L*.085,0,0,TAU); c.fill();
    // 复眼
    c.fillStyle='#221003';
    c.beginPath(); c.ellipse(L*.38,-L*.075,L*.045,L*.032,-.35,0,TAU); c.fill();
    c.beginPath(); c.ellipse(L*.38, L*.075,L*.045,L*.032, .35,0,TAU); c.fill();
    c.fillStyle='rgba(255,236,200,.35)';
    c.beginPath(); c.ellipse(L*.375,-L*.082,L*.018,L*.012,-.35,0,TAU); c.fill();
    // 尾须
    c.strokeStyle='#5e3013'; c.lineWidth=Math.max(1,L*.026); c.lineCap='round';
    for(const s of [-1,1]){
      c.beginPath(); c.moveTo(-L*.50,s*L*.06);
      c.quadraticCurveTo(-L*.60,s*L*.11,-L*.66,s*L*.10); c.stroke();
    }
    // ---- 触角（长、会抖）----
    c.strokeStyle='#3b1e08'; c.lineWidth=Math.max(.8,L*.017);
    for(const s of [-1,1]){
      const w=Math.sin(this.antennaPhase+s*1.1)*L*.10;
      const w2=Math.sin(this.antennaPhase*1.3+s*2.0)*L*.14;
      c.beginPath(); c.moveTo(L*.38,s*L*.05);
      c.bezierCurveTo(L*.62,s*L*.16+w,L*.82,s*L*.30+w2,L*1.02,s*L*.46+w2*.6);
      c.stroke();
    }
    c.restore();
  }
}
function lerpAng(a,b,t){ let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t; }

/* ============ 拖鞋 ============ */
const slipper={x:-999,y:-999,px:-999,py:-999,smash:0,swing:0,vx:0,vy:0};
function drawSlipper(c,t){
  const x=slipper.x,y=slipper.y;
  if(x<-100) return;
  const spd=Math.hypot(slipper.vx,slipper.vy);
  // 残影
  if(spd>320){
    c.save(); c.globalAlpha=.16;
    for(let i=1;i<=3;i++){
      c.save(); c.translate(x-slipper.vx*.012*i,y-slipper.vy*.012*i);
      c.rotate(-0.55+slipper.swing); c.scale(.96,.96);
      c.beginPath(); c.ellipse(0,0,52,30,0,0,TAU); c.fillStyle='#2b4f7a'; c.fill(); c.restore();
    }
    c.restore();
  }
  const s=slipper.smash;                 // 0..1 拍下进度
  const scale=1-s*.14;
  const rot=-0.55+slipper.swing+(s<.5? s*1.5 : (1-s)*1.5)*0.75;
  c.save(); c.translate(x,y); c.rotate(rot); c.scale(scale,scale);
  // 影子
  c.save(); c.globalAlpha=.30+(1-s)*.05; c.fillStyle='#000';
  c.beginPath(); c.ellipse(6,10+s*10,52,29,0,0,TAU); c.fill(); c.restore();
  // 鞋底侧面
  c.fillStyle='#1d3c60';
  roundRect(c,-50,-26,100,54,26); c.fill();
  // 鞋面
  const g=c.createLinearGradient(-50,-26,-50,28);
  g.addColorStop(0,'#5b90d6'); g.addColorStop(.55,'#3f6ea8'); g.addColorStop(1,'#2a4d7d');
  c.fillStyle=g; roundRect(c,-46,-22,92,46,22); c.fill();
  // 鞋床凹槽
  c.fillStyle='rgba(255,255,255,.10)';
  roundRect(c,-38,-15,74,30,15); c.fill();
  // 鞋带（人字拖 / 一字拖）
  c.fillStyle='#1a3557';
  roundRect(c,-6,-30,30,60,15); c.fill();
  c.fillStyle='rgba(255,255,255,.14)';
  roundRect(c,-4,-28,12,56,7); c.fill();
  // 高光
  c.fillStyle='rgba(255,255,255,.22)';
  c.beginPath(); c.ellipse(-24,-12,20,6,-.25,0,TAU); c.fill();
  // 鞋头纹理
  c.strokeStyle='rgba(0,0,0,.14)'; c.lineWidth=2;
  for(let i=0;i<4;i++){c.beginPath();c.moveTo(-40+i*4,-16);c.lineTo(-40+i*4,16);c.stroke();}
  c.restore();
  // 拍击冲击环
  if(s>0&&s<.85){
    c.save(); c.globalAlpha=(1-s)*.55;
    c.strokeStyle='#fff'; c.lineWidth=3+s*3;
    c.beginPath(); c.arc(x,y,26+s*70,0,TAU); c.stroke();
    c.globalAlpha=(1-s)*.30; c.strokeStyle='#ffd98a';
    c.beginPath(); c.arc(x,y,14+s*40,0,TAU); c.stroke(); c.restore();
  }
  // 判定圈（极淡）
  c.save(); c.globalAlpha=.13; c.strokeStyle='#fff'; c.lineWidth=1.5;
  c.setLineDash([6,7]); c.beginPath(); c.arc(x,y,HIT_R,0,TAU); c.stroke(); c.restore();
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* ============ 粒子 / 爆浆 ============ */
const parts=[], pops=[], rings=[];
// 触屏手指没鼠标精准，判定放宽一点
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const HIT_R=isTouch?64:52;
function splat(x,y,ang,len){
  // 地面永久污渍
  sc.save(); sc.translate(x,y); sc.rotate(ang);
  for(let i=0;i<16;i++){
    const dx=rand(-len*.55,len*.55), dy=rand(-len*.34,len*.34);
    const r=rand(3,len*.20);
    sc.globalAlpha=rand(.35,.72);
    sc.fillStyle=pick(GOO);
    sc.beginPath(); sc.ellipse(dx,dy,r,r*rand(.5,.9),rand(0,TAU),0,TAU); sc.fill();
  }
  sc.globalAlpha=.85; sc.fillStyle='#5b3410';
  sc.beginPath(); sc.ellipse(0,0,len*.30,len*.18,0,0,TAU); sc.fill();
  // 溅射尾迹
  for(let i=0;i<7;i++){
    const a=ang+Math.PI+rand(-.9,.9), d=rand(20,88);
    sc.globalAlpha=rand(.25,.5); sc.fillStyle=pick(GOO);
    sc.beginPath(); sc.ellipse(Math.cos(a)*d,Math.sin(a)*d,rand(2,7),rand(1.5,4),a,0,TAU); sc.fill();
  }
  sc.restore();
  // 飞溅粒子
  const n=26;
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), v=rand(60,330);
    parts.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      r:rand(2,7.5),life:rand(.45,1.1),t:0,c:pick(GOO),stain:Math.random()<.4});
  }
  // 断肢
  for(let i=0;i<4;i++){
    const a=rand(0,TAU), v=rand(90,240);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rand(2,3.6),life:rand(.6,1.0),t:0,
      c:'#3b1e08',leg:true,rot:rand(0,TAU)});
  }
  rings.push({x,y,t:0,life:.45,r0:10,r1:90});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){
      if(p.stain){ sc.globalAlpha=.35; sc.fillStyle=p.c;
        sc.beginPath(); sc.ellipse(p.x,p.y,p.r*.9,p.r*.7,0,0,TAU); sc.fill(); }
      parts.splice(i,1); continue;
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const f=Math.pow(.0016,dt); p.vx*=f; p.vy*=f; p.vy+=40*dt;
    if(p.leg) p.rot+=dt*6;
  }
  for(let i=rings.length-1;i>=0;i--){ rings[i].t+=dt; if(rings[i].t>=rings[i].life) rings.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){ const q=pops[i]; q.t+=dt; q.y-=34*dt; if(q.t>=q.life) pops.splice(i,1); }
}
function drawParts(c){
  for(const p of parts){
    const k=1-p.t/p.life; c.globalAlpha=clamp(k*1.5,0,1); c.fillStyle=p.c;
    if(p.leg){ c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
      c.fillRect(-p.r*2.2,-p.r*.45,p.r*4.4,p.r*.9); c.restore(); }
    else { c.beginPath(); c.ellipse(p.x,p.y,p.r*(.5+k*.5),p.r*(.4+k*.6),0,0,TAU); c.fill(); }
  }
  c.globalAlpha=1;
  for(const r of rings){
    const k=r.t/r.life; c.save(); c.globalAlpha=(1-k)*.5;
    c.strokeStyle='#ffdf9c'; c.lineWidth=3*(1-k)+1;
    c.beginPath(); c.arc(r.x,r.y,r.r0+(r.r1-r.r0)*k,0,TAU); c.stroke(); c.restore();
  }
}
function drawPops(c){
  c.textAlign='center';
  for(const q of pops){
    const k=q.t/q.life; c.globalAlpha=clamp(2*(1-k),0,1);
    c.font='800 '+(q.big?30:22)+'px "PingFang SC","Microsoft YaHei",sans-serif';
    c.lineWidth=5; c.strokeStyle='rgba(20,12,4,.8)';
    c.strokeText(q.txt,q.x,q.y); c.fillStyle=q.color; c.fillText(q.txt,q.x,q.y);
  }
  c.globalAlpha=1;
}

/* ============ 游戏主逻辑 ============ */
const G={running:false,mode:'timed',time:30,score:0,kills:0,clicks:0,hits:0,combo:0,maxCombo:0,
  comboT:0,spawnT:0,shake:0,endlessT:0,surged:false,speedMul:1,lastLv:-1};
const roaches=[];
const COMBO_WINDOW=2.5;
const el=id=>document.getElementById(id);

// 难度强度：限时模式 0(开局) → 1(剩余 5 秒，峰值) 后保持；无限模式继续爬到 1.5
function difficulty(){
  if(G.mode==='endless') return Math.min(1.5,1+G.endlessT/120);
  return clamp((30-G.time)/25,0,1);
}
function updateModeUI(){
  const endless=G.running&&G.mode==='endless';
  el('btnQuit').style.display=endless?'block':'none';
  el('timeLab').textContent=endless?'无限击杀':'剩余时间';
  if(!endless) el('timeVal').classList.remove('warn');
}
function startTimed(){
  roaches.length=0; parts.length=0; pops.length=0; rings.length=0;
  sc.clearRect(0,0,W,H);
  G.running=true; G.mode='timed'; G.time=30; G.score=0; G.kills=0; G.clicks=0; G.hits=0;
  G.combo=0; G.maxCombo=0; G.comboT=0; G.spawnT=.6; G.shake=0;
  G.endlessT=0; G.surged=false; G.speedMul=1; G.lastLv=-1;
  // 开局先在屏幕里放 3 只，免得前两秒空场
  for(let i=0;i<3;i++){ const r=new Roach(); r.x=rand(W*.15,W*.85); r.y=rand(H*.15,H*.85);
    r.alpha=.9; roaches.push(r); }
  el('scoreVal').textContent='0'; updateComboUI(); updateModeUI();
  el('startScreen').classList.add('hide'); el('endScreen').classList.add('hide');
  AC();
}
function startEndless(){
  // 无限击杀：沿用当前分数/击杀继续打，不清场，难度从峰值继续爬
  G.running=true; G.mode='endless'; G.endlessT=0; G.spawnT=.3;
  G.combo=0; G.comboT=0; G.surged=true; G.speedMul=2.15;
  updateComboUI(); updateModeUI();
  el('startScreen').classList.add('hide'); el('endScreen').classList.add('hide');
  AC();
  pops.push({x:W/2,y:H*0.36,t:0,life:1.2,txt:'无限击杀！随时可退出',color:'#ff9d3d',big:true});
}
function quitEndless(){
  if(!G.running||G.mode!=='endless') return;
  G.running=false; endGame();
}
function endGame(){
  G.running=false;
  const endless=G.mode==='endless';
  el('endTitle').textContent=endless?'已退出无限击杀':'时间到';
  el('statTime').style.display=endless?'block':'none';
  el('fTime').textContent=G.endlessT.toFixed(0)+'s';
  el('fScore').textContent=G.score;
  el('fKill').textContent=G.kills;
  el('fCombo').textContent=G.maxCombo;
  el('fAcc').textContent=(G.clicks?Math.round(G.hits/G.clicks*100):0)+'%';
  updateModeUI();
  let r='灭蟑新星',c='#ffe6b0';
  const s=G.score;
  if(s>=80){r='蟑 螂 克 星';c='#ff8a3d';}
  else if(s>=60){r='灭 蟑 大 师';c='#ffb03d';}
  else if(s>=40){r='除 害 专 家';c='#ffc861';}
  else if(s>=22){r='熟 练 打 工 人';c='#ffd98a';}
  const rk=el('rank'); rk.textContent=r; rk.style.color=c;
  el('endScreen').classList.remove('hide');
}
function updateComboUI(){
  const v=el('comboVal');
  if(G.combo>=2){ v.textContent='x'+G.combo+'  +'+comboBonus(); v.classList.add('on'); }
  else v.classList.remove('on');
  el('comboBar').style.width=(G.combo>=2? clamp(G.comboT/COMBO_WINDOW,0,1)*100:0)+'%';
  el('scoreVal').textContent=G.score;
}
function comboBonus(){ const b=Math.floor(G.combo/2); return Math.min(5,b); }

function smash(mx,my){
  if(!G.running) return;
  G.clicks++; slipper.smash=0.001; sfxSwat();
  const hits=[];
  for(const r of roaches){
    if(r.dead) continue;
    if(Math.hypot(r.x-mx,r.y-my) < HIT_R + r.len*0.22) hits.push(r);
  }
  if(hits.length===0){
    G.combo=0; G.comboT=0; updateComboUI();
    pops.push({x:mx,y:my-20,t:0,life:.6,txt:'空挥…',color:'#cfc0a4',big:false});
    return;
  }
  for(const r of hits){
    r.dead=true; r.squash=0; G.kills++; G.hits++;
    G.combo = G.comboT>0 ? G.combo+1 : 1;
    G.comboT=COMBO_WINDOW; G.maxCombo=Math.max(G.maxCombo,G.combo);
    const bonus=comboBonus(); const gain=1+bonus; G.score+=gain;
    splat(r.x,r.y,r.angle,r.len);
    pops.push({x:r.x,y:r.y-14,t:0,life:.85,txt:'+'+gain+(bonus?'  COMBO x'+G.combo:''),
      color: bonus?'#ff9d3d':'#ffe9c2', big:bonus>0});
    G.shake=Math.min(10,G.shake+6);
    sfxSplat();
    if(G.combo>=2) sfxCombo(G.combo);
  }
  updateComboUI();
}

/* ---- 输入 ---- */
function onMove(x,y){
  slipper.vx=(x-slipper.x)*60; slipper.vy=(y-slipper.y)*60;
  if(slipper.x<-100){slipper.px=x;slipper.py=y;}
  slipper.x=x; slipper.y=y;
}
window.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
window.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  if(e.target&&e.target.tagName==='BUTTON') return;   // 点按钮时不判定拍打
  onMove(e.clientX,e.clientY); smash(e.clientX,e.clientY);
});
window.addEventListener('contextmenu',e=>{ if(e.target===cv) e.preventDefault(); });
// 注意：touchstart 里无条件 preventDefault() 会连手机上的 click 一起吞掉，
// 导致「开始 / 再来一局」按钮点不动。所以按钮和未开局状态一律不拦。
const isUI=e=>!!(e.target&&(e.target.tagName==='BUTTON'||e.target.id==='btnSound'));
window.addEventListener('touchstart',e=>{
  if(isUI(e)) return;
  if(!G.running) return;
  e.preventDefault();
  const t=e.touches[0]; onMove(t.clientX,t.clientY); smash(t.clientX,t.clientY);
},{passive:false});
window.addEventListener('touchmove',e=>{
  if(!G.running) return;
  e.preventDefault();
  const t=e.touches[0]; onMove(t.clientX,t.clientY);
},{passive:false});
// 移动端按钮快速响应（touchend 直接触发，同时拦掉后续 click 避免重复）
['btnStart','btnAgain','btnEndless'].forEach(id=>{
  el(id).addEventListener('touchend',e=>{
    if(G.running) return;
    e.preventDefault(); (id==='btnEndless'?startEndless:startTimed)();
  },{passive:false});
});
el('btnQuit').addEventListener('touchend',e=>{ e.preventDefault(); quitEndless(); },{passive:false});
window.addEventListener('resize',resize);
el('btnStart').addEventListener('click',startTimed);
el('btnAgain').addEventListener('click',startTimed);
el('btnEndless').addEventListener('click',startEndless);
el('btnQuit').addEventListener('click',quitEndless);
el('btnSound').addEventListener('click',e=>{ muted=!muted; e.target.textContent=muted?'🔇':'🔊'; e.stopPropagation(); });
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!G.running) startTimed();
  if(e.code==='Escape') quitEndless();          // 无限模式随时 Esc 退出
});

/* ---- 主循环 ---- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05);
  ctx.clearRect(0,0,W,H);

  if(G.running){
    // 强度 d：开局 0 → 剩余 5 秒达到 1（峰值）后保持；无限模式继续爬到 1.5
    const d=difficulty();
    G.speedMul=Math.min(2.5,1+1.15*d);          // 全场蟑螂移动速度倍率（峰值 2.15x）
    if(G.mode==='endless'){
      G.endlessT+=dt;
    }else{
      G.time-=dt;
      if(G.time<=0){ G.time=0; endGame(); }
      else if(!G.surged && G.time<=5){          // 剩余 5 秒：虫潮爆发
        G.surged=true;
        for(let i=0;i<4;i++) roaches.push(new Roach());
        pops.push({x:W/2,y:H*0.30,t:0,life:1.4,txt:'虫潮爆发！',color:'#ff5b3d',big:true});
      }
    }
    if(G.running){
      G.spawnT-=dt;
      const alive=roaches.filter(r=>!r.dead).length;
      // 5 只 → 20 只（峰值）；小屏按面积缩放，避免手机上挤爆 + 掉帧
      const areaF=clamp(W*H/(1280*800),0.55,1);
      const maxAlive=Math.max(6,Math.min(26,Math.round((5+15*d)*areaF)));
      if(G.spawnT<=0 && alive<maxAlive){
        G.spawnT=Math.max(0.16,0.78-0.56*d)*rand(.7,1.25);  // 0.78s → 0.22s
        let n=1;
        if(d>.45&&Math.random()<.45) n++;
        if(d>.80&&Math.random()<.40) n++;
        for(let i=0;i<n&&roaches.length<maxAlive+2;i++) roaches.push(new Roach());
      }
      if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0){G.combo=0;} }
      const lv=Math.min(9,1+Math.floor(d*5));
      if(lv!==G.lastLv){ G.lastLv=lv; el('chaosVal').textContent='虫潮 LV.'+lv+(d>=1?' 🔥':''); }
      const tv=el('timeVal');
      if(G.mode==='timed'){
        tv.textContent=G.time.toFixed(1);
        tv.classList.toggle('warn',G.time<=5);
      }else{
        tv.textContent=G.endlessT.toFixed(0)+'s';
      }
      if(G.combo>=2) el('comboBar').style.width=clamp(G.comboT/COMBO_WINDOW,0,1)*100+'%';
    }
  }

  if(!G.running && roaches.length<5){ const r=new Roach(); r.x=rand(60,W-60); r.y=rand(60,H-60); roaches.push(r); }

  // 蟑螂
  const mx=slipper.x,my=slipper.y;
  for(let i=roaches.length-1;i>=0;i--){
    const r=roaches[i]; r.update(dt,mx,my);
    if(r.dead&&r.squash>=1){ roaches.splice(i,1); continue; }
    if(r.esc) { roaches.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=r.alpha; r.draw(ctx); ctx.restore();
  }
  updateParts(dt);
  drawParts(ctx);

  // 拖鞋
  if(slipper.smash>0){ slipper.smash+=dt*5.2; if(slipper.smash>=1) slipper.smash=0; }
  slipper.swing+=(clamp(slipper.vx/900,-.35,.35)-slipper.swing)*Math.min(1,dt*10);
  slipper.vx*=Math.pow(.02,dt); slipper.vy*=Math.pow(.02,dt);
  drawSlipper(ctx,now/1000);

  drawPops(ctx);
  requestAnimationFrame(loop);
}

/* ---- 启动 ---- */
resize();
// 起始屏幕放几只蟑螂做预览
for(let i=0;i<5;i++){ const r=new Roach(); r.x=rand(80,W-80); r.y=rand(80,H-80); roaches.push(r); }
requestAnimationFrame(loop);
})();
</script>
